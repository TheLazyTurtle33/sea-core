services:
  web:
    build:
      context: .          # repo root — now Docker can see /shared
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/web:/app/data

  bot:
    build:
      context: .          # repo root — now Docker can see /shared
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/bot:/app/data
      - ~/.ssh/tts_key:/root/.ssh/tts_key:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "40000:40000"
    security_opt:
      - "apparmor:unconfined"
      - "seccomp:unconfined"
    cap_add:
      - SYS_PTRACE
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host # only have on when wanna ssh
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  postgres:
    container_name: postgres_container
    image: postgres:16
    environment:
      POSTGRES_USER: turt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sea_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  piper:
      image: python:3.11-slim
      restart: unless-stopped
      volumes:
        - ./data/piper/models:/models
      working_dir: /app
      command: >
        sh -c "pip install piper-tts flask --quiet &&
              python -m piper.http_server --model /models/en_US-lessac-medium.onnx --data-dir /models"
      ports:
        - "5000:5000"

  # vosk:
  #   image: alphacep/kaldi-en:latest
  #   container_name: vosk
  #   user: root
  #   volumes:
  #     - ./data/vosk/models/vosk-model-en-us-0.22:/opt/vosk-model-en/model
  #   restart: unless-stopped

volumes:
  pg_data:
    driver: local