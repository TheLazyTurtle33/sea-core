services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/web:/app/data

  bot:
    build: ./bot
    restart: unless-stopped
    volumes:
      - ./data/bot:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}